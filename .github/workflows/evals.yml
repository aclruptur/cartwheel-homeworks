# The CI workflow for Homework 6.
#
# On every push, the workflow runs unit and integration tests without model
# calls. On pull requests and each nightly run, the workflow runs the complete
# evaluation tests five times and applies the rule saved with each test. The pull
# request job also checks whether an evaluation request was copied into the
# agent prompt or a judge example.
#
# Homework 8 adds the Module 4 adversarial tests to the offline-checks job, so
# a security regression fails the same workflow as a quality regression.

name: evals

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * *" # nightly, catches provider-side drift between PRs

jobs:
  offline-checks:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Unit and integration tests, with no model keys
        run: uv run pytest tests/eval -k "unit or integration" -q
      - name: Homework structural checks
        run: uv run pytest tests/test_hw_holes.py -q

  complete-evaluations:
    name: complete evaluations and leakage check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_RUN_E2E: "1"
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install Harbor
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          harbor --version
      - name: Evaluation case and prompt leakage check
        run: uv run python scripts/check_leakage.py
      - name: Generate Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py
      - name: CI evaluation tests, with five runs per complete test
        run: |
          test -n "$CARTWHEEL_MODEL"
          PYTHONPATH="$PWD" harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --n-concurrent 2 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes
      - name: Summarize evaluation results
        if: always()
        run: |
          uv run python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --expected-attempts 5
      - name: Upload Harbor job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
